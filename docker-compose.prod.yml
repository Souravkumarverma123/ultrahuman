services:
  postgresdb:
    image: postgres:15
    restart: unless-stopped
    container_name: ultrahuman-postgresdb-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-souravkumar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souravkumar178}
      POSTGRES_DB: ${POSTGRES_DB:-ultrahuman}
    expose:
      - "5432"
    volumes:
      - ultrahuman-db-prod:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/souravkumarverma123/ultrahuman-api:latest
    restart: unless-stopped
    depends_on:
      postgresdb:
        condition: service_healthy
    deploy:
      replicas: 2
    environment:
      NODE_ENV: prod
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-souravkumar}:${POSTGRES_PASSWORD:-souravkumar178}@postgresdb:5432/${POSTGRES_DB:-ultrahuman}
      BASE_URL: ${BASE_URL:-https://ultrahuman.co.in}
      WEB_URL: ${WEB_URL:-https://ultrahuman.co.in}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://ultrahuman.co.in}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET}}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://ultrahuman.co.in/corsair/callback}
      CORSAIR_KEK: ${CORSAIR_KEK}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  web:
    image: ghcr.io/souravkumarverma123/ultrahuman-web:latest
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ultrahuman.co.in}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://ultrahuman.co.in}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: ultrahuman_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ultrahuman-db-prod:
  caddy_data:
  caddy_config:
